<!DOCTYPE html>
<html>
<head>
    <title>Karachi House Price Predictor</title>
    <style>
        body { font-family: Arial; text-align: center; background-color: #f4f4f4; padding: 50px; }
        .container { background: white; width: 450px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px gray; }
        select, input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; padding: 10px; border: none; cursor: pointer; width: 90%; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Karachi House Price</h2>
        <form id="predictionForm">
            <input type="number" name="area_sqft" placeholder="Area in Sqft" required>
            
            <select name="bedrooms" required>
                <option value="" disabled selected>Select Bedrooms</option>
                {% for bed in bedrooms %}
                <option value="{{ bed }}">{{ bed }}</option>
                {% endfor %}
            </select>

            <select name="bathrooms" required>
                <option value="" disabled selected>Select Bathrooms</option>
                {% for bath in bathrooms %}
                <option value="{{ bath }}">{{ bath }}</option>
                {% endfor %}
            </select>

            <select name="location" required>
                <option value="" disabled selected>Select Location</option>
                {% for loc in locations %}
                <option value="{{ loc }}">{{ loc }}</option>
                {% endfor %}
            </select>

            <button type="button" onclick="send_data()">Predict Price</button>
        </form>
        <h3 id="prediction_text"></h3>
    </div>

    <script>
        function send_data() {
            var form = document.getElementById('predictionForm');
            var fd = new FormData(form);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/predict', true);
            document.getElementById('prediction_text').innerHTML = "Predicting...";

            xhr.onreadystatechange = function() {
                if(xhr.readyState == XMLHttpRequest.DONE) {
                    document.getElementById('prediction_text').innerHTML = "Price: PKR " + xhr.responseText;
                }
            };
            xhr.send(fd);
        }
    </script>
</body>
</html>
